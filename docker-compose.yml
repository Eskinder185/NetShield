# NetShield local development stack. Everything binds to 127.0.0.1 only: nothing is exposed to your network.
# Usage: copy .env.example to .env, then `docker compose up --build`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: netshield
      POSTGRES_USER: netshield
      POSTGRES_PASSWORD: ${NETSHIELD_DB_PASSWORD:?copy .env.example to .env and set NETSHIELD_DB_PASSWORD}
    ports: ["127.0.0.1:${NETSHIELD_DB_HOST_PORT:-55432}:5432"]
    volumes: [netshield-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netshield -d netshield"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./services/api
    depends_on:
      db: { condition: service_healthy }
    environment:
      NETSHIELD_DB_URL: jdbc:postgresql://db:5432/netshield
      NETSHIELD_DB_USER: netshield
      NETSHIELD_DB_PASSWORD: ${NETSHIELD_DB_PASSWORD}
      NETSHIELD_BIND: 0.0.0.0   # inside the container only; the published port below is loopback-bound
      NETSHIELD_CORS_ORIGINS: http://127.0.0.1:${NETSHIELD_WEB_PORT:-8081},http://localhost:${NETSHIELD_WEB_PORT:-8081}
    ports: ["127.0.0.1:${NETSHIELD_API_PORT:-8080}:8080"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  web:
    build: ./apps/web
    depends_on: [api]
    ports: ["127.0.0.1:${NETSHIELD_WEB_PORT:-8081}:80"]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
volumes:
  netshield-db:
