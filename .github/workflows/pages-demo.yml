name: Public demo (GitHub Pages)
on:
  push:
    branches:
      - feat/netshield-foundation
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/web
      - name: Build public frontend preview
        run: npm run build
        working-directory: apps/web
        env:
          GITHUB_PAGES: 'true'
          VITE_STATIC_DEMO: 'true'
      - name: Disable Jekyll
        run: touch apps/web/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publish static demo
        id: deployment
        uses: actions/deploy-pages@v4
